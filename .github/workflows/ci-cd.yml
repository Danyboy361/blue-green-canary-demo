name: CI/CD - Build Docker Images

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build v1 image
        run: docker build -t blue-green-demo-v1 ./app/v1

      - name: Build v2 image
        run: docker build -t blue-green-demo-v2 ./app/v2

      - name: Build Nginx image
        run: docker build -t blue-green-demo-nginx ./nginx
